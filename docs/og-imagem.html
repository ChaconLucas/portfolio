<!doctype html>
<html><head><meta charset="utf-8">
<!-- Molde da imagem de compartilhamento (public/og.jpg, 1200x630). Para gerar:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og.png "file://$PWD/docs/og-imagem.html"
  e salve como JPG (qualidade ~88, abaixo de 300 KB por causa do WhatsApp). -->
<style>
  :root{--roxo:#a98bff;--roxo2:#6d3bff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#07060c}
  body{position:relative;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
  /* fundo: nebulosa roxa, malha de blueprint e estrelas */
  .neb{position:absolute;inset:0;
    background:
      radial-gradient(600px 420px at 83% 42%,rgba(109,59,255,.55),transparent 70%),
      radial-gradient(420px 300px at 64% 90%,rgba(255,61,139,.22),transparent 70%),
      radial-gradient(500px 400px at 8% 0%,rgba(109,59,255,.18),transparent 70%)}
  .malha{position:absolute;inset:0;opacity:.35;
    background-image:linear-gradient(rgba(169,139,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(169,139,255,.12) 1px,transparent 1px);
    background-size:40px 40px;
    -webkit-mask:radial-gradient(900px 600px at 70% 50%,#000 20%,transparent 75%)}
  .estrelas{position:absolute;inset:0}
  /* texto */
  .txt{position:absolute;left:72px;top:92px;width:520px}
  .selo{display:inline-flex;align-items:center;gap:10px;font:700 14px/1 "Helvetica Neue",Arial;letter-spacing:.28em;color:var(--roxo);
    padding:9px 14px;border:1px solid rgba(169,139,255,.35);border-radius:999px;background:rgba(109,59,255,.12)}
  .selo i{width:8px;height:8px;border-radius:50%;background:#2bff8f;box-shadow:0 0 12px #2bff8f}
  h1{margin-top:26px;font:900 108px/.86 "Helvetica Neue",Arial Black,Arial;letter-spacing:-.045em}
  h1 span{display:block;background:linear-gradient(95deg,#c7b4ff,#8a5cff 60%,#ff5fa8);-webkit-background-clip:text;color:transparent}
  .cargo{margin-top:26px;font:800 26px/1 "Helvetica Neue",Arial;letter-spacing:.02em}
  .pilha{margin-top:14px;font:500 20px/1.3 "Helvetica Neue",Arial;color:rgba(255,255,255,.62)}
  .url{position:absolute;left:72px;bottom:48px;display:flex;align-items:center;gap:12px;font:600 17px/1 ui-monospace,Menlo,monospace;color:rgba(255,255,255,.55)}
  .url b{color:#fff;font-weight:700}
  .url::before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--roxo2),transparent)}
  /* cartas dos projetos em leque */
  .leque{position:absolute;right:22px;top:0;width:640px;height:630px}
  .c{position:absolute;border-radius:18px;overflow:hidden;background:#111;
    box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
  .c img{display:block;width:100%;height:100%;object-fit:cover}
  .c em{position:absolute;left:14px;bottom:12px;font:800 13px/1 "Helvetica Neue",Arial;font-style:normal;letter-spacing:.14em;
    padding:7px 10px;border-radius:999px;background:rgba(7,6,12,.78);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
  .gate{width:430px;height:230px;left:118px;top:62px;transform:rotate(-5deg)}
  .gate em{left:auto;right:14px;top:14px;bottom:auto}
  .gate img{object-position:0 0}
  .rare{width:370px;height:196px;left:150px;top:350px;transform:rotate(3deg)}
  .rare em{left:140px;bottom:16px}
  .rare img{object-position:50% 45%}
  .wsl{width:164px;height:292px;left:0px;top:292px;transform:rotate(-9deg);border-radius:24px}
  .wsl img{object-position:50% 30%}
  .flash{width:168px;height:318px;left:448px;top:168px;transform:rotate(8deg);border-radius:26px;z-index:3}
  .flash img{object-position:50% 0}
  .gate em{color:#c7b4ff}.rare em{color:#e6c46a}.wsl em{color:#5ff0d0}.flash em{color:#ff5a5a}
  .brilho{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 35%)}
</style></head>
<body>
  <div class="neb"></div><div class="malha"></div>
  <svg class="estrelas" width="1200" height="630" id="st"></svg>
  <div class="txt">
    <div class="selo"><i></i>PORTFÓLIO · RIO DE JANEIRO</div>
    <h1>LUCAS<span>CHACON</span></h1>
    <div class="cargo">Full Stack Developer</div>
    <div class="pilha">Web · APIs · Mobile · Segurança · IA<br>GateCheck · WSL Games · Rare7 · FLASH</div>
  </div>
  <div class="url"><span><b>portfolio-delta-five-78</b>.vercel.app</span></div>
  <div class="leque">
    <div class="c gate"><img src="../public/assets/projects/gatecheck-1.webp"><div class="brilho"></div><em>GATECHECK</em></div>
    <div class="c rare"><img src="../public/assets/projects/rare7-1.webp"><div class="brilho"></div><em>RARE7</em></div>
    <div class="c wsl"><img src="../public/assets/projects/wsl-1.webp"><div class="brilho"></div><em>WSL</em></div>
    <div class="c flash"><img src="../public/assets/projects/flash-1.webp"><div class="brilho"></div><em>FLASH</em></div>
  </div>
<script>
  // estrelas deterministicas
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const st = document.getElementById('st');
  for (let i = 0; i < 90; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', r() * 1200); c.setAttribute('cy', r() * 630); c.setAttribute('r', r() * 1.2 + .3);
    c.setAttribute('fill', '#fff'); c.setAttribute('opacity', (r() * .5 + .1).toFixed(2)); st.appendChild(c);
  }
</script>
</body></html>
